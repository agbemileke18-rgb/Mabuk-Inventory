<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Inventory Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
</head>

<body>
    <div id="auth-container" style="text-align: center; padding: 50px; margin-top: 20px;">
        <h2>Welcome to MabukStock</h2>
        <p>Please log in to manage your inventory.</p>

        <input type="email" id="email-input" placeholder="Enter your email"
            style="padding: 10px; margin: 5px; width: 80%; max-width: 300px;" /><br>
        <input type="password" id="password-input" placeholder="Enter your password"
            style="padding: 10px; margin: 5px; width: 80%; max-width: 300px;" /><br><br>

        <button id="signup-btn" style="padding: 10px 20px; margin: 5px; cursor: pointer;">Sign Up</button>
        <button id="login-btn" style="padding: 10px 20px; margin: 5px; cursor: pointer;">Log In</button>
    </div>

    <div class="dashboard-container">
        <header>
            <h1>Mabuk Golden Enterprise - Inventory Calculator</h1>
            <button id="exportBtn" class="btn-primary">Download CSV Report</button>
        </header>

        <main class="dashboard-grid">
            <section class="card">
                <h3>Add / Edit Product</h3>
                <form id="add-item-form">
                    <div class="input-group">
                        <label>Product Name</label>
                        <input type="text" id="itemName" placeholder="e.g., 60x60 Glazed Tiles" required>
                    </div>

                    <div class="input-group">
                        <label>Category</label>
                        <select id="itemCategory" required>
                            <option value="Tiles">Tiles</option>
                            <option value="White Cement">White Cement</option>
                            <option value="Genesis">Genesis</option>
                            <option value="Roofing Sheets">Roofing Sheets</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                        <input type="text" id="searchBar" class="search-input" placeholder="Search by product name..."
                            style="margin-bottom: 0;">

                        <select id="categoryFilter" class="search-input" style="margin-bottom: 0; max-width: 200px;">
                            <option value="All">All Categories</option>
                            <option value="Tiles">Tiles</option>
                            <option value="White Cement">White Cement</option>
                            <option value="Genesis">Genesis</option>
                            <option value="Roofing Sheets">Roofing Sheets</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="input-group-row">
                        <div class="input-group">
                            <label>Quantity</label>
                            <input type="number" id="itemQty" placeholder="0" min="1" required>
                        </div>
                        <div class="input-group">
                            <label>Unit Cost (₦)</label>
                            <input type="number" id="itemCost" placeholder="0" min="0" required>
                        </div>
                        <div class="input-group">
                            <label>Selling Price (₦)</label>
                            <input type="number" id="itemPrice" placeholder="0" min="0" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Add to Inventory</button>
                </form>
            </section>

            <section class="dashboard-data">
                <div class="card summary-cards">
                    <div class="stat-box">
                        <h4>Total Cost</h4>
                        <p>₦<span id="display-cost">0</span></p>
                    </div>
                    <div class="stat-box">
                        <h4>Projected Revenue</h4>
                        <p>₦<span id="display-revenue">0</span></p>
                    </div>
                    <div class="stat-box profit">
                        <h4>Total Profit</h4>
                        <p>₦<span id="display-profit">0</span></p>
                    </div>
                </div>

                <div class="card">
                    <h3>Current Stock</h3>
                    <input type="text" id="searchBar" class="search-input" placeholder="Search by product name...">
                    <select id="categoryFilter" class="search-input" style="margin-bottom: 0; max-width: 200px;">
                        <option value="All">All Categories</option>
                        <option value="Tiles">Tiles</option>
                        <option value="White Cement">White Cement</option>
                        <option value="Genesis">Genesis</option>
                        <option value="Roofing Sheets">Roofing Sheets</option>
                        <option value="Other">Other</option>
                    </select>
                    <ul id="inventory-list">
                    </ul>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlZIwhWgeWkHrskLCuOVuW4l2P6NZ9__4",
            authDomain: "mabukstock.firebaseapp.com",
            projectId: "mabukstock",
            storageBucket: "mabukstock.firebasestorage.app",
            messagingSenderId: "749625031008",
            appId: "1:749625031008:web:a8e565bcbdde99c22d0605",
            measurementId: "G-0K9NNGR1R7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        window.db = getFirestore(app);

        const emailInput = document.getElementById('email-input');
        const passwordInput = document.getElementById('password-input');
        const signupBtn = document.getElementById('signup-btn');
        const loginBtn = document.getElementById('login-btn');
        const authContainer = document.getElementById('auth-container');
        const dashboardContainer = document.querySelector('.dashboard-container');

        signupBtn.addEventListener('click', () => {
            createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
                .then((userCredential) => {
                    alert("Account created successfully!");
                })
                .catch((error) => {
                    alert("Error: " + error.message);
                });
        });

        loginBtn.addEventListener('click', () => {
            signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
                .then((userCredential) => {
                    alert("Logged in successfully!");
                })
                .catch((error) => {
                    alert("Error: " + error.message);
                });
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authContainer.style.display = "none";
                dashboardContainer.style.display = "block";
            } else {
                authContainer.style.display = "block";
                dashboardContainer.style.display = "none";
            }
        });
    </script>

    <script src="app.js"></script>
</body>

</html>
